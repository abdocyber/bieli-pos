name: BieLi POS Integration Tests

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

jobs:
  android-integration:
    name: Android POS Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true
      - name: Install Dependencies
        run: flutter pub get
      - name: Run Unit Tests
        run: flutter test
      - name: Run POS Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          boot-timeout: 900
          script: flutter test integration_test/pos_workflow_test.dart
