name: Build BieLi POS (Windows & Android)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true
      - name: Install Dependencies
        run: flutter pub get
      - name: Run Unit Tests
        run: flutter test
      - name: Run POS Integration Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: flutter test integration_test/pos_workflow_test.dart
      - name: Build APK
        run: flutter build apk --release
      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BieLi-Android-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true
      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop
      - name: Install Dependencies
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Compress Release Directory
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath BieLi-Windows-x64.zip
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BieLi-Windows-Release-ZIP
          path: BieLi-Windows-x64.zip
